<!doctype html>
<!-- Sorgente dell'immagine di anteprima per i social (assets/img/og.png, 1200×630). Vedi README per rigenerarla. -->
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--text);font-family:var(--font-sans)}
body{box-sizing:border-box;padding:64px;display:flex;flex-direction:column;justify-content:space-between}
.path{font:400 22px/1 var(--font-mono);color:var(--muted)}
.path b{font-weight:400;color:var(--ink)}
.who{display:flex;align-items:center;gap:32px}
.who img{width:128px;height:128px;object-fit:cover;display:block}
h1{margin:0;font-size:88px;line-height:1;font-weight:500;letter-spacing:-0.02em;color:var(--ink)}
.role{margin:16px 0 0;font:400 24px/1 var(--font-mono);letter-spacing:0.04em;text-transform:uppercase;color:var(--muted)}
.foot{display:flex;justify-content:space-between;font:400 22px/1 var(--font-mono);color:var(--text);border-top:1px solid var(--line-strong);padding-top:24px}
</style>
</head>
<body>
<div class="path">~ / <b>home</b></div>
<div class="who"><img src="../assets/img/immagine-profilo.jpg" alt=""><div><h1>Andrea Manzo</h1><p class="role">Graphic designer</p></div></div>
<div class="foot"><span>Branding · Advertising · Packaging · Web design</span><span>andreamanzo.it</span></div>
</body>
</html>
